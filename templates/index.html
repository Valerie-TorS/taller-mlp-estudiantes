<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predicción de aprobación - MLP</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--tx:#1f2430;--mut:#6b7280;--pri:#2f5bea;--ok:#15803d;--bad:#b91c1c}
  @media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1b1e27;--tx:#e8eaf0;--mut:#9aa1b2;--pri:#6c8cff;--ok:#4ade80;--bad:#f87171}}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center;padding:24px}
  .card{background:var(--card);max-width:460px;width:100%;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0002}
  h1{font-size:1.3rem;margin:0 0 4px} p{color:var(--mut);margin:0 0 16px;font-size:.9rem}
  label{display:block;font-size:.85rem;margin:12px 0 4px}
  input,select{width:100%;padding:10px;border:1px solid #8884;border-radius:8px;background:transparent;color:var(--tx);font-size:1rem}
  button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-size:1rem;cursor:pointer}
  #res{margin-top:18px;padding:14px;border-radius:8px;text-align:center;font-weight:600;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>¿Aprobará el estudiante?</h1>
  <p>Ingresa los datos y el perceptrón multicapa (MLP) estimará el resultado. Si dejas un campo vacío se usa la mediana del entrenamiento.</p>
  <label>Tareas (0-100)<input id="Tareas" type="number" step="any" min="0" max="100"></label>
  <label>Exámenes (0-100)<input id="Examenes" type="number" step="any" min="0" max="100"></label>
  <label>Asistencia % (0-100)<input id="Asistencia" type="number" step="any" min="0" max="100"></label>
  <label>Horas de estudio por semana<input id="Estudio_Horas" type="number" step="any" min="0"></label>
  <label>Horas de sueño por día<input id="Sueno_Horas" type="number" step="any" min="0" max="24"></label>
  <label>Actividades extracurriculares
    <select id="Extracurriculares"><option value="0">No</option><option value="1">Sí</option></select></label>
  <button id="btn">Predecir</button>
  <div id="res"></div>
</div>
<script>
const campos = ["Tareas","Examenes","Asistencia","Estudio_Horas","Sueno_Horas","Extracurriculares"];
document.getElementById("btn").onclick = async () => {
  const body = {};
  campos.forEach(c => body[c] = document.getElementById(c).value);
  const r = await fetch("/predict", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const d = await r.json(), box = document.getElementById("res");
  box.style.display = "block";
  if (d.error) { box.style.color = "var(--bad)"; box.textContent = d.error; return; }
  box.style.color = d.aprobado ? "var(--ok)" : "var(--bad)";
  box.textContent = d.resultado + " (probabilidad de aprobar: " + (d.probabilidad_aprobar*100).toFixed(1) + "%)";
};
</script>
</body>
</html>
